<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت رسانه | پنل مدیریت غنچه لاله زار</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-rose"></i>
                <h2>غنچه لاله زار</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>داشبورد</span></a>
                <a href="posts.html" class="nav-item"><i class="fas fa-file-alt"></i><span>مطالب</span></a>
                <a href="pages.html" class="nav-item"><i class="fas fa-copy"></i><span>صفحات</span></a>
                <a href="media.html" class="nav-item active"><i class="fas fa-images"></i><span>رسانه‌ها</span></a>
                <a href="users.html" class="nav-item"><i class="fas fa-users"></i><span>کاربران</span></a>
                <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i><span>تنظیمات</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>مشاهده سایت</span></a>
                <a href="#" class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>خروج</span></a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div class="topbar-title"><h1>مدیریت رسانه</h1></div>
                <div class="topbar-user">
                    <span id="user-name">Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=c2185b&color=fff" alt="User" class="user-avatar">
                </div>
            </header>

            <div class="content-wrapper">
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-cloud-upload-alt"></i> آپلود رسانه</h3>
                    </div>
                    <div class="card-body">
                        <div class="upload-area" id="upload-area">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>فایل‌های خود را اینجا رها کنید یا کلیک کنید</p>
                            <input type="file" id="file-input" multiple accept="image/*,application/pdf" style="display: none;">
                        </div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><i class="fas fa-images"></i> گالری رسانه</h3>
                    </div>
                    <div class="card-body">
                        <div class="media-grid" id="media-grid">
                            <p class="loading">در حال بارگذاری...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <style>
        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #c2185b;
            background: #fce4ec;
        }
        .upload-area i {
            font-size: 4rem;
            color: #c2185b;
            margin-bottom: 15px;
        }
        .upload-area p {
            color: #666;
            font-size: 1.1rem;
        }
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        .media-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .media-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 10px;
            color: white;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>

    <script src="auth.js"></script>
    <script src="api-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuth = await requireAuth();
            if (!isAuth) return;

            const user = getCurrentUser();
            if (user) {
                document.getElementById('user-name').textContent = user.first_name || user.username;
            }

            loadMedia();
            setupUpload();
        });

        async function loadMedia() {
            try {
                const response = await apiClient.getMedia();
                const grid = document.getElementById('media-grid');

                if (!response.data || response.data.length === 0) {
                    grid.innerHTML = '<p class="loading">هنوز رسانه‌ای آپلود نشده است</p>';
                    return;
                }

                grid.innerHTML = response.data.map(item => `
                    <div class="media-item">
                        <img src="${item.filepath}" alt="${item.alt_text || item.filename}">
                        <div class="overlay">${item.filename}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading media:', error);
                document.getElementById('media-grid').innerHTML = '<p class="loading">خطا در بارگذاری</p>';
            }
        }

        function setupUpload() {
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');

            uploadArea.addEventListener('click', () => fileInput.click());

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#c2185b';
                uploadArea.style.background = '#fce4ec';
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#ddd';
                uploadArea.style.background = 'transparent';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#ddd';
                uploadArea.style.background = 'transparent';
                handleFiles(e.dataTransfer.files);
            });

            fileInput.addEventListener('change', () => {
                handleFiles(fileInput.files);
            });
        }

        async function handleFiles(files) {
            for (const file of files) {
                try {
                    await apiClient.uploadMedia({
                        filename: file.name,
                        alt_text: file.name.split('.')[0]
                    });
                } catch (error) {
                    console.error('Upload error:', error);
                }
            }
            loadMedia();
            alert('فایل‌ها با موفقیت آپلود شدند');
        }

        async function handleLogout() {
            await logout();
            window.location.href = 'login.html';
        }

        function toggleSidebar() {
            document.querySelector('.admin-wrapper').classList.toggle('sidebar-open');
        }
    </script>
</body>
</html>
