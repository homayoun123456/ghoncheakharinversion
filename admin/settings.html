<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنظیمات | پنل مدیریت غنچه لاله زار</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-rose"></i>
                <h2>غنچه لاله زار</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>داشبورد</span></a>
                <a href="posts.html" class="nav-item"><i class="fas fa-file-alt"></i><span>مطالب</span></a>
                <a href="pages.html" class="nav-item"><i class="fas fa-copy"></i><span>صفحات</span></a>
                <a href="media.html" class="nav-item"><i class="fas fa-images"></i><span>رسانه‌ها</span></a>
                <a href="users.html" class="nav-item"><i class="fas fa-users"></i><span>کاربران</span></a>
                <a href="settings.html" class="nav-item active"><i class="fas fa-cog"></i><span>تنظیمات</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>مشاهده سایت</span></a>
                <a href="#" class="nav-item" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>خروج</span></a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <div class="topbar-title"><h1>تنظیمات</h1></div>
                <div class="topbar-user">
                    <span id="user-name">Admin</span>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=c2185b&color=fff" alt="User" class="user-avatar">
                </div>
            </header>

            <div class="content-wrapper">
                <div class="settings-grid">
                    <div class="dashboard-card">
                        <div class="card-header">
                            <h3><i class="fas fa-globe"></i> تنظیمات عمومی</h3>
                        </div>
                        <div class="card-body">
                            <form id="general-settings-form">
                                <div class="form-group">
                                    <label for="site-title">عنوان سایت</label>
                                    <input type="text" id="site-title" value="غنچه لاله زار">
                                </div>
                                <div class="form-group">
                                    <label for="site-description">توضیحات سایت</label>
                                    <textarea id="site-description" rows="3">تولید و صادرات غنچه گل محمدی از لاله زار کرمان</textarea>
                                </div>
                                <div class="form-group">
                                    <label for="site-email">ایمیل سایت</label>
                                    <input type="email" id="site-email" value="info@ghoncheye-lalehzar.com">
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> ذخیره تغییرات
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="dashboard-card">
                        <div class="card-header">
                            <h3><i class="fas fa-share-alt"></i> شبکه‌های اجتماعی</h3>
                        </div>
                        <div class="card-body">
                            <form id="social-settings-form">
                                <div class="form-group">
                                    <label for="whatsapp">واتساپ</label>
                                    <input type="text" id="whatsapp" value="+989122127437">
                                </div>
                                <div class="form-group">
                                    <label for="instagram">اینستاگرام</label>
                                    <input type="text" id="instagram" placeholder="@username">
                                </div>
                                <div class="form-group">
                                    <label for="telegram">تلگرام</label>
                                    <input type="text" id="telegram" placeholder="@channel">
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> ذخیره تغییرات
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="dashboard-card">
                        <div class="card-header">
                            <h3><i class="fas fa-server"></i> اطلاعات سرور</h3>
                        </div>
                        <div class="card-body">
                            <div class="info-list">
                                <div class="info-item">
                                    <span class="info-label">API Server</span>
                                    <span class="info-value" id="api-url">http://localhost:3001</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">وضعیت</span>
                                    <span class="info-value status-online" id="server-status">بررسی...</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">نسخه</span>
                                    <span class="info-value">1.0.0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <style>
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #666;
        }
        .info-value {
            font-weight: 500;
        }
        .status-online {
            color: #2e7d32;
        }
        .status-offline {
            color: #c62828;
        }
    </style>

    <script src="auth.js"></script>
    <script src="api-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuth = await requireAuth();
            if (!isAuth) return;

            const user = getCurrentUser();
            if (user) {
                document.getElementById('user-name').textContent = user.first_name || user.username;
            }

            checkServerStatus();
        });

        async function checkServerStatus() {
            const statusEl = document.getElementById('server-status');
            try {
                await apiClient.healthCheck();
                statusEl.textContent = 'آنلاین';
                statusEl.className = 'info-value status-online';
            } catch (error) {
                statusEl.textContent = 'آفلاین';
                statusEl.className = 'info-value status-offline';
            }
        }

        document.getElementById('general-settings-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('تنظیمات ذخیره شد');
        });

        document.getElementById('social-settings-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('تنظیمات ذخیره شد');
        });

        async function handleLogout() {
            await logout();
            window.location.href = 'login.html';
        }

        function toggleSidebar() {
            document.querySelector('.admin-wrapper').classList.toggle('sidebar-open');
        }
    </script>
</body>
</html>
