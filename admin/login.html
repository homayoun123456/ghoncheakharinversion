<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت | غنچه لاله زار</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #c2185b 0%, #8e24aa 50%, #303f9f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header i {
            font-size: 3rem;
            color: #c2185b;
            margin-bottom: 15px;
        }
        .login-header h1 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #c2185b;
            box-shadow: 0 0 0 3px rgba(194, 24, 91, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #c2185b, #8e24aa);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(194, 24, 91, 0.3);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .success-message.show {
            display: block;
        }
        .demo-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
        .demo-info p {
            color: #1565c0;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .demo-info code {
            background: #1565c0;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #666;
            text-decoration: none;
        }
        .back-link a:hover {
            color: #c2185b;
        }
        .spinner {
            display: none;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-rose"></i>
            <h1>پنل مدیریت</h1>
            <p>غنچه لاله زار</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">نام کاربری</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="btn-submit">
                <i class="fas fa-sign-in-alt"></i>
                <span id="btn-text">ورود به سیستم</span>
                <i class="fas fa-spinner spinner" id="spinner"></i>
            </button>
        </form>

        <div class="demo-info">
            <p>برای تست از اطلاعات زیر استفاده کنید:</p>
            <p>نام کاربری: <code>admin</code> | رمز عبور: <code>admin123</code></p>
        </div>

        <div class="back-link">
            <a href="../index.html"><i class="fas fa-arrow-right"></i> بازگشت به سایت</a>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // API Base URL
        const API_BASE_URL = 'http://localhost:3001/api';

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            // Auto-login check from URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('autologin') === '1') {
                document.getElementById('username').value = 'admin';
                document.getElementById('password').value = 'admin123';
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }

            // Check existing auth
            try {
                const isLoggedIn = await checkAuth();
                if (isLoggedIn) {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {
                // Not logged in, stay on login page
            }
        });

        // Handle login form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const btnSubmit = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            // Hide messages
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            // Show loading
            btnSubmit.disabled = true;
            btnText.textContent = 'در حال ورود...';
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Save token
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    successDiv.textContent = 'ورود موفق! در حال انتقال...';
                    successDiv.classList.add('show');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    errorDiv.textContent = data.error || 'نام کاربری یا رمز عبور اشتباه است';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'خطا در ارتباط با سرور. لطفاً اطمینان حاصل کنید که سرور API در حال اجرا است.';
                errorDiv.classList.add('show');
                console.error('Login error:', error);
            } finally {
                btnSubmit.disabled = false;
                btnText.textContent = 'ورود به سیستم';
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
